---
name: Update package
on:
  workflow_dispatch:
  schedule:
    # every 15 minutes
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  update-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run nix-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            --use-github-releases \
            --version-regex 'app-v(.*)' \
            --src-only \
            --system x86_64-linux \
            daggerfall-js
      - name: Commit and push
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add packages/x86_64-linux.nix
            git commit -m "daggerfall-js: update linux package to $(grep -oG 'version = "[0-9.]*"' packages/x86_64-linux.nix | grep -oG '[0-9.]*')"
            git push
          else
            echo "No update available"
          fi
  update-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run nix-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            --use-github-releases \
            --version-regex 'app-v(.*)' \
            --src-only \
            --system aarch64-darwin \
            daggerfall-js
      - name: Commit and push
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git add packages/aarch64-darwin.nix
            git commit -m "daggerfall-js: update darwin package to $(grep -oG 'version = "[0-9.]*"' packages/aarch64-darwin.nix | grep -oG '[0-9.]*')"
            git push
          else
            echo "No update available"
          fi
